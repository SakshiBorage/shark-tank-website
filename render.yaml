services:
  - type: web
    name: shark-tank-hq
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shark-tank-hq-db
          property: connectionString

databases:
  - name: shark-tank-hq-db
    plan: free
